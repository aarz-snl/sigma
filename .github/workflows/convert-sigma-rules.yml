name: Convert Sigma Rules to Kibana

on:
  push:
    branches:
      - add-artifact-creation-job
  workflow_dispatch:

jobs:
  convert-rules:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Clone Sigma Repository
        run: |
          git clone https://github.com/SigmaHQ/sigma.git
        
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install sigma-cli
          sigma plugin install elasticsearch
          
      - name: Convert Sigma Rules
        run: |
          # Create directory for all rules
          mkdir -p public

          # Convert Windows rules sample
          find ./sigma/rules/windows -type f -name "*.yml" | head -n 10 > windows_rules.txt
          sigma convert -t lucene -p ecs_windows -f siem_rule_ndjson $(cat windows_rules.txt) > public/windows_rules.ndjson
          sed -i 's/"tags": \[[^]]*\]/"tags": \["Sigma Windows"\]/g; s/"severity": "informational"/"severity": "low"/g; s/"enabled": true/"enabled": false/g' public/windows_rules.ndjson
          
      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: public
          branch: gh-pages