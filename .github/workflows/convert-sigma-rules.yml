name: Convert Sigma Rules to Kibana (Test)

on:
  push:
    branches:
      - add-artifact-creation-job
  workflow_dispatch:

jobs:
  convert-rules:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Needed for creating releases
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Clone Sigma Repository
        run: |
          git clone https://github.com/SigmaHQ/sigma.git
        
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install sigma-cli
          sigma plugin install elasticsearch
          
      - name: Convert Windows Rules (Sample)
        run: |
          # Just convert a few rules for testing
          find ./sigma/rules/windows -type f -name "*.yml" | head -n 10 > windows_rules.txt
          sigma convert -t lucene -p ecs_windows -f siem_rule_ndjson $(cat windows_rules.txt) > windows_rules.ndjson
          sed -i 's/"tags": \[[^]]*\]/"tags": \["Sigma Windows"\]/g; s/"severity": "informational"/"severity": "low"/g; s/"enabled": true/"enabled": false/g' windows_rules.ndjson
          
      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v1
        with:
          name: "Sigma Rules for Kibana"
          tag_name: sigma-rules-${{ github.run_number }}
          files: windows_rules.ndjson
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}